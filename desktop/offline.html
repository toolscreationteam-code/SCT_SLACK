<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVK Workspace - Connecting...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1A1D21;
      color: #E0E2E5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .card {
      background: #222529;
      border: 1px solid #383C40;
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #4a154b, #1f0820);
      border: 1px solid rgba(236, 178, 46, 0.5);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 800;
      color: #ECB22E;
      box-shadow: 0 4px 16px rgba(236, 178, 46, 0.15);
    }
    h1 {
      font-size: 20px;
      color: #FFFFFF;
      margin-bottom: 8px;
      font-weight: 700;
    }
    p.subtitle {
      font-size: 13px;
      color: #9AA0A6;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(236, 178, 46, 0.1);
      border: 1px solid rgba(236, 178, 46, 0.3);
      color: #ECB22E;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(236, 178, 46, 0.3);
      border-top-color: #ECB22E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background: #007A5A;
      color: white;
    }
    .btn-primary:hover {
      background: #148567;
    }
    .btn-secondary {
      background: #2C3136;
      color: #D1D5DB;
      border: 1px solid #3E4348;
    }
    .btn-secondary:hover {
      background: #383D43;
      color: white;
    }
    .server-config {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #2D3136;
      display: none;
      text-align: left;
    }
    .server-config.visible {
      display: block;
    }
    label {
      display: block;
      font-size: 11px;
      color: #9AA0A6;
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 9px 12px;
      background: #1A1D21;
      border: 1px solid #3E4348;
      border-radius: 6px;
      color: white;
      font-size: 13px;
      outline: none;
      margin-bottom: 10px;
    }
    input:focus {
      border-color: #ECB22E;
    }
    .hint {
      font-size: 11px;
      color: #6B7280;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">AVK</div>
    <h1>AVK Workspace</h1>
    <p class="subtitle">Connecting to AVK real-time cloud server...</p>

    <div class="status-badge">
      <div class="spinner"></div>
      <span id="status-text">Connecting in <b id="countdown">3</b>s</span>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="retryNow()">Retry Now</button>
      <button class="btn-secondary" onclick="toggleConfig()">Server URL</button>
    </div>

    <div id="config-box" class="server-config">
      <label>Server URL / Network IP:</label>
      <input type="text" id="server-url-input" placeholder="http://localhost:5000" />
      <button class="btn-primary" style="width:100%" onclick="saveAndRetry()">Save & Connect</button>
      <p class="hint">Default: http://localhost:5000 or your host IP (e.g. http://192.168.0.205:5000)</p>
    </div>
  </div>

  <script>
    const DEFAULT_URL = 'http://localhost:5000';
    let currentUrl = localStorage.getItem('sct_server_url') || DEFAULT_URL;
    document.getElementById('server-url-input').value = currentUrl;

    let timeLeft = 3;
    let timerId = null;

    function startTimer() {
      timeLeft = 3;
      updateText();
      clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--;
        updateText();
        if (timeLeft <= 0) {
          clearInterval(timerId);
          tryConnect();
        }
      }, 1000);
    }

    function updateText() {
      const cd = document.getElementById('countdown');
      if (cd) cd.textContent = timeLeft;
    }

    async function tryConnect() {
      document.getElementById('status-text').innerHTML = '<div class="spinner"></div> Checking connection...';
      try {
        const pingUrl = currentUrl.replace(/\/$/, '') + '/api/channels';
        const res = await fetch(pingUrl, { method: 'GET', cache: 'no-store' });
        // Any response or 200/401/403 means server is alive!
        window.location.href = currentUrl;
      } catch (e) {
        document.getElementById('status-text').textContent = 'Server unavailable. Retrying...';
        setTimeout(startTimer, 1500);
      }
    }

    function retryNow() {
      clearInterval(timerId);
      tryConnect();
    }

    function toggleConfig() {
      const box = document.getElementById('config-box');
      box.classList.toggle('visible');
    }

    function saveAndRetry() {
      let val = document.getElementById('server-url-input').value.trim();
      if (!val) val = DEFAULT_URL;
      if (!val.startsWith('http://') && !val.startsWith('https://')) {
        val = 'http://' + val;
      }
      currentUrl = val;
      localStorage.setItem('sct_server_url', currentUrl);
      retryNow();
    }

    // Initial check
    tryConnect();
  </script>
</body>
</html>
