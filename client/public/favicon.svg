<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A154B" />
      <stop offset="100%" stop-color="#1E0720" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#ECB22E" />
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bgGrad)" stroke="#ECB22E" stroke-width="4" />
  <!-- Inner Glow Border -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="none" stroke="rgba(236, 178, 46, 0.25)" stroke-width="2" />
  <!-- AVK Text in Gold -->
  <text x="64" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">AVK</text>
</svg>
